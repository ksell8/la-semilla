---
- name: Download Ollama install script
  ansible.builtin.get_url:
    url: https://ollama.com/install.sh
    dest: /tmp/install-ollama.sh
    mode: "0755"
  become: false

- name: Install Ollama
  ansible.builtin.command: /tmp/install-ollama.sh
  register: ollama_install_result
  changed_when: "'installed' in ollama_install_result.stdout or 'Updated' in ollama_install_result.stdout"
  failed_when: ollama_install_result.rc != 0 and 'already installed' not in ollama_install_result.stderr
  become: false
  notify: Restart Ollama

- name: Create ollama systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/ollama.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Allow Ollama to listen on all interfaces
  ansible.builtin.template:
    src: ollama-override.conf.j2
    dest: /etc/systemd/system/ollama.service.d/override.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart Ollama

- name: Check if gemma model exists locally
  ansible.builtin.command: ollama show gemma:2b
  register: ollama_gemma
  failed_when: false
  changed_when: false
  become: false

- name: Pull gemma model if it was not found
  ansible.builtin.command: ollama pull gemma:2b
  when: ollama_gemma.rc != 0
  changed_when: true
  become: false

- name: Setup Docker for Landing Page
  ansible.builtin.include_role:
    name: docker

- name: Deploy aiwebui Service
  ansible.builtin.template:
    src: aiwebui.service.j2
    dest: /etc/systemd/system/aiwebui.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart aiwebui
