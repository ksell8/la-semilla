---
- name: Create local certs directory
  ansible.builtin.file:
    path: "{{ playbook_dir }}/certs"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false

- name: Check if CA cert exists and is valid
  ansible.builtin.command: openssl x509 -checkend 0 -noout -in "{{ playbook_dir }}/certs/ca.crt"
  delegate_to: localhost
  become: false
  register: ca_valid
  failed_when: false
  changed_when: false

- name: Generate CA key
  ansible.builtin.command: openssl genrsa -out "{{ playbook_dir }}/certs/ca.key" 4096
  delegate_to: localhost
  become: false
  when: ca_valid.rc != 0

- name: Generate CA cert
  ansible.builtin.command: >
    openssl req -new -x509 -days 3650
    -key "{{ playbook_dir }}/certs/ca.key"
    -out "{{ playbook_dir }}/certs/ca.crt"
    -subj "/CN=La Semilla CA"
  delegate_to: localhost
  become: false
  when: ca_valid.rc != 0

- name: Check if server cert exists and is valid
  ansible.builtin.command: openssl x509 -checkend 0 -noout -in "{{ playbook_dir }}/certs/server.crt"
  delegate_to: localhost
  become: false
  register: server_cert_valid
  failed_when: false
  changed_when: false

- name: Generate server key
  ansible.builtin.command: openssl genrsa -out "{{ playbook_dir }}/certs/server.key" 2048
  delegate_to: localhost
  become: false
  when: server_cert_valid.rc != 0

- name: Generate server CSR
  ansible.builtin.command: >
    openssl req -new
    -key "{{ playbook_dir }}/certs/server.key"
    -out "{{ playbook_dir }}/certs/server.csr"
    -subj "/CN={{ hostname }}"
  delegate_to: localhost
  become: false
  when: server_cert_valid.rc != 0

- name: Write SAN extension file
  ansible.builtin.copy:
    content: "subjectAltName=DNS:{{ hostname }}"
    dest: "{{ playbook_dir }}/certs/server.ext"
  delegate_to: localhost
  become: false
  when: server_cert_valid.rc != 0

- name: Sign server cert with CA
  ansible.builtin.command: >
    openssl x509 -req -days 3650
    -in "{{ playbook_dir }}/certs/server.csr"
    -CA "{{ playbook_dir }}/certs/ca.crt"
    -CAkey "{{ playbook_dir }}/certs/ca.key"
    -CAcreateserial
    -extfile "{{ playbook_dir }}/certs/server.ext"
    -out "{{ playbook_dir }}/certs/server.crt"
  delegate_to: localhost
  become: false
  when: server_cert_valid.rc != 0

- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Create nginx ssl directory
  ansible.builtin.file:
    path: /etc/nginx/ssl
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Copy server cert to Pi
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/certs/server.crt"
    dest: /etc/nginx/ssl/server.crt
    owner: root
    group: root
    mode: '0644'
  notify: reload nginx

- name: Copy server key to Pi
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/certs/server.key"
    dest: /etc/nginx/ssl/server.key
    owner: root
    group: root
    mode: '0600'
  notify: reload nginx

- name: Copy biblioteca app
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/apps/biblioteca/"
    dest: /var/www/biblioteca/
    owner: www-data
    group: www-data
    mode: '0644'

- name: Setup Ollama app
  ansible.builtin.include_role:
    name: ollama
  when: enable_ai

- name: Deploy biblioteca nginx config
  ansible.builtin.template:
    src: biblioteca.conf.j2
    dest: /etc/nginx/sites-available/biblioteca
    owner: root
    group: root
    mode: '0644'
  notify: reload nginx

- name: Enable biblioteca site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/biblioteca
    dest: /etc/nginx/sites-enabled/biblioteca
    state: link
  notify: reload nginx

- name: Deploy aiwebui nginx config
  ansible.builtin.template:
    src: aiwebui.conf.j2
    dest: /etc/nginx/sites-available/aiwebui
    owner: root
    group: root
    mode: '0644'
  notify: reload nginx
  when: enable_ai

- name: Enable aiwebui site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/aiwebui
    dest: /etc/nginx/sites-enabled/aiwebui
    state: link
  notify: reload nginx
  when: enable_ai

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Enable and start nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started
