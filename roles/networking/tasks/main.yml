---
- name: Install dnsmasq
  apt:
    name:
      - dnsmasq
    state: present

- name: Configure hotspot connection via NetworkManager
  template:
    src: hotspot.nmconnection.j2
    dest: /etc/NetworkManager/system-connections/la-semilla-hotspot.nmconnection
    owner: root
    group: root
    mode: '0600'
  notify: activate hotspot connection

- name: Force WPA2 on hotspot connection
  command: >                                                                                                                                                                       
    nmcli connection modify la-semilla-hotspot                                                                                                                                     
    802-11-wireless-security.proto rsn                                                                                                                                             
    802-11-wireless-security.pairwise ccmp
  notify: activate hotspot connection

- name: Deploy dnsmasq config
  template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart dnsmasq

- name: Enable and start dnsmasq
  systemd:
    name: dnsmasq
    enabled: true
    state: started